name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate tag, manifest, and changelog versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          manifest_version="$(node -p "require('./Info.json').version")"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag v$tag_version does not match Info.json version $manifest_version" >&2
            exit 1
          fi
          if ! grep -Fq "## [$manifest_version] -" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $manifest_version" >&2
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
      - name: Install development dependencies
        run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Validate and test
        run: |
          npm run check
          npm test
          npm run test:ui
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-release-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build release package and checksum
        run: npm run package
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.iinaplgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/publish-release.sh
      - name: Verify published package download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          verification_dir="$RUNNER_TEMP/quick-folders-release-$VERSION"
          mkdir -p "$verification_dir"
          gh release download "$RELEASE_TAG" \
            --pattern "quick-folders-v${VERSION}.iinaplgz" \
            --pattern "quick-folders-v${VERSION}.iinaplgz.sha256" \
            --dir "$verification_dir"
          (cd "$verification_dir" && sha256sum -c "quick-folders-v${VERSION}.iinaplgz.sha256")
          node scripts/verify-plugin-package.mjs "$verification_dir/quick-folders-v${VERSION}.iinaplgz"
