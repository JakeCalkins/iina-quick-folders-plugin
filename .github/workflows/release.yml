name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate tag, manifest, and changelog versions
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./quick-folders.iinaplugin/Info.json').version")"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag v$tag_version does not match Info.json version $manifest_version" >&2
            exit 1
          fi
          if ! grep -Fq "## [$manifest_version] -" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $manifest_version" >&2
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
      - name: Validate and test
        run: |
          npm run check
          npm test
      - name: Build release package and checksum
        run: npm run package
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.iinaplgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/quick-folders-v${VERSION}.iinaplgz#Quick Folders ${VERSION}" \
            "dist/quick-folders-v${VERSION}.iinaplgz.sha256#SHA-256 checksum" \
            --verify-tag \
            --fail-on-no-commits \
            --title "Quick Folders v${VERSION}" \
            --notes $'## Installation\n\nDownload the `.iinaplgz` file below and open it with IINA. You can also install from the GitHub repository URL to receive updates.\n' \
            --generate-notes
